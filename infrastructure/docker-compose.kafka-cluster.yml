# Optional: a 3-broker Kafka cluster for the broker-failure experiment.
#   docker compose -f docker-compose.yml -f docker-compose.kafka-cluster.yml --profile bigdata up -d
# Topics are created with replication factor 3 and the controller quorum runs
# KRaft (Kafka's own Raft). Stop one broker:  docker compose stop kafka2
# Producers and the Spark job keep working because 2 of 3 replicas remain.
x-kafka-env: &kafka-env
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_HEAP_OPTS: -Xmx256m -Xms256m

services:
  kafka:
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
  kafka2:
    image: apache/kafka:3.9.1
    profiles: [bigdata]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
  kafka3:
    image: apache/kafka:3.9.1
    profiles: [bigdata]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
  api-1:
    environment:
      KAFKA_BROKERS: kafka:9092,kafka2:9092,kafka3:9092
      KAFKA_REPLICATION_FACTOR: 3
  api-2:
    environment:
      KAFKA_BROKERS: kafka:9092,kafka2:9092,kafka3:9092
      KAFKA_REPLICATION_FACTOR: 3
  spark-streaming:
    environment:
      KAFKA_BOOTSTRAP: kafka:9092,kafka2:9092,kafka3:9092
