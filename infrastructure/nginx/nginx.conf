# Load balancer in front of two API instances.
upstream ruralhealth_api {
  server api-1:4000 max_fails=2 fail_timeout=5s;
  server api-2:4000 max_fails=2 fail_timeout=5s;
}

server {
  listen 80;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://ruralhealth_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    # If one API instance is down, retry on the other one. Retrying POST is
    # normally unsafe, but our sync push is idempotent (unique event IDs), so a
    # repeated request can never apply a change twice.
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    proxy_next_upstream_tries 2;
  }

  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # PWA install file: phones need the correct type to offer "Add to Home screen".
  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
